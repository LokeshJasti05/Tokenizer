<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tokenizer — BPE Token Visualizer</title>
  <meta name="description" content="Visualize how your custom BPE tokenizer splits text into tokens. See token counts, token IDs, and colored token segments in real-time." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ════════════════════════════════════════════════════
       HEADER
  ════════════════════════════════════════════════════ -->
  <header class="site-header">
    <div class="header-inner">
      <div class="logo-wrap">
        <div class="logo-icon">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect width="24" height="24" rx="6" fill="currentColor"/>
            <path d="M7 8h10M7 12h6M7 16h8" stroke="white" stroke-width="1.8" stroke-linecap="round"/>
          </svg>
        </div>
        <h1 class="logo-text">Tokenizer</h1>
      </div>

      <div class="header-controls">
        <div class="model-select-wrap">
          <select id="modelSelect" class="model-select" aria-label="Select tokenizer model">
            <option value="custom-bpe">Custom BPE (v1)</option>
          </select>
          <svg class="select-arrow" viewBox="0 0 10 6" fill="none">
            <path d="M1 1l4 4 4-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
      </div>
    </div>
  </header>

  <!-- ════════════════════════════════════════════════════
       MAIN LAYOUT
  ════════════════════════════════════════════════════ -->
  <main class="main-layout">

    <!-- ── LEFT PANEL ───────────────────────────────── -->
    <section class="panel panel-left" aria-label="Input panel">

      <!-- Single prompt input -->
      <div class="prompt-input-section">
        <label class="section-label" for="promptInput">Enter Prompt</label>
        <textarea
          id="promptInput"
          class="prompt-textarea"
          placeholder="Type your prompt here…"
          aria-label="Enter your prompt text"
          spellcheck="false"
        ></textarea>
      </div>

      <!-- Raw prompt display -->
      <div class="raw-prompt-section">
        <label class="section-label" for="rawPromptArea">Raw Prompt</label>
        <textarea
          id="rawPromptArea"
          class="raw-prompt-area"
          readonly
          aria-label="Formatted raw prompt with special tokens"
          placeholder="Formatted prompt will appear here…"
        ></textarea>
      </div>

    </section>

    <!-- ── RIGHT PANEL ──────────────────────────────── -->
    <section class="panel panel-right" aria-label="Token visualisation panel">

      <!-- Token count card -->
      <div class="card token-count-card" id="tokenCountCard">
        <div class="token-count-label">Token count</div>
        <div class="token-count-value" id="tokenCountValue">0</div>
      </div>

      <!-- Loading indicator -->
      <div class="loading-bar" id="loadingBar" aria-hidden="true">
        <div class="loading-bar-inner"></div>
      </div>

      <!-- Colored token visualisation -->
      <div class="card token-vis-card">
        <div class="card-header-row">
          <span class="card-title">Token visualization</span>
          <label class="whitespace-toggle" for="showWhitespace">
            <input type="checkbox" id="showWhitespace" />
            <span class="toggle-track"></span>
            <span class="toggle-label">Show whitespace</span>
          </label>
        </div>
        <div class="token-vis" id="tokenVis" aria-label="Colored token segments" role="region">
          <span class="placeholder-text">Start typing to see token colors…</span>
        </div>
      </div>

      <!-- Token IDs -->
      <div class="card token-ids-card">
        <div class="card-header-row">
          <span class="card-title">Token IDs</span>
          <button class="btn-copy" id="copyIdsBtn" aria-label="Copy token IDs" title="Copy to clipboard">
            <svg viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
              <rect x="5" y="5" width="9" height="9" rx="1.5" stroke="currentColor" stroke-width="1.5"/>
              <path d="M11 5V3.5A1.5 1.5 0 0 0 9.5 2h-6A1.5 1.5 0 0 0 2 3.5v6A1.5 1.5 0 0 0 3.5 11H5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            </svg>
            Copy
          </button>
        </div>
        <div class="token-ids-output" id="tokenIdsOutput" aria-label="Token IDs">
          <span class="placeholder-text">—</span>
        </div>
      </div>

      <!-- History panel -->
      <div class="card history-card" id="historyCard">
        <div class="card-header-row">
          <span class="card-title">Recent sessions</span>
          <button class="btn-ghost btn-small" id="refreshHistoryBtn" aria-label="Refresh history">
            <svg viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
              <path d="M13.5 8A5.5 5.5 0 1 1 8 2.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
              <path d="M8 2.5V5l2-1.5L8 2.5Z" fill="currentColor"/>
            </svg>
            Refresh
          </button>
        </div>
        <div class="history-list" id="historyList">
          <span class="placeholder-text">No sessions yet</span>
        </div>
      </div>

    </section>
  </main>

  <!-- ════════════════════════════════════════════════════
       FOOTER
  ════════════════════════════════════════════════════ -->
  <footer class="site-footer">
    <span>Built with a custom BPE tokenizer from scratch in Python</span>
    <a href="https://github.com/LokeshJasti05/Tokenizer" target="_blank" rel="noopener" class="footer-link" aria-label="View source on GitHub">
      <svg viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" width="18" height="18">
        <path d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.531 1.032 1.531 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0 1 12 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0 0 22 12.017C22 6.484 17.522 2 12 2Z"/>
      </svg>
      GitHub
    </a>
  </footer>

  <!-- Copy toast -->
  <div class="toast" id="copyToast" aria-live="polite">Copied to clipboard!</div>

  <script src="app.js"></script>
</body>
</html>
